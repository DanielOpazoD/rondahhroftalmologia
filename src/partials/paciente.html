<!--
  Datos del paciente: UNA plantilla para Ingreso y Atención (el build la expande).
  Dos filas completas en 4 columnas (RUT · apellidos · nombres / nacimiento · edad · sexo · fono);
  en 2 columnas (celular) quedan de a pares, sin campos sueltos.
  {p} = prefijo de los ids (paciente_ / ing_); {sexo} = id del selector de sexo;
  {msg:campo} = mensaje de validación (solo donde se valida: la atención).
-->
<div>
  <label class="l" for="{p}rut">RUT</label>
  <div class="rutwrap">
    <input id="{p}rut" autocomplete="off" placeholder="12.345.678-9" /><span
      class="rutmark"
      data-rut-for="{p}rut"
      aria-live="polite"
    ></span>
  </div>
  {msg:rut}
</div>
<div><label class="l" for="{p}apellido_paterno">Apellido paterno</label><input id="{p}apellido_paterno" autocomplete="off" /></div>
<div><label class="l" for="{p}apellido_materno">Apellido materno</label><input id="{p}apellido_materno" autocomplete="off" /></div>
<div>
  <label class="l" for="{p}nombres">Nombres</label><input id="{p}nombres" autocomplete="off" />{msg:nombres}
  <input id="{p}nombre" type="hidden" />
  <small class="hint" data-legacy-name="{p}" hidden></small>
</div>
<div><label class="l" for="{p}fnac">Fecha de nacimiento</label><input id="{p}fnac" type="date" />{msg:fnac}</div>
<div><label class="l" for="{p}edad">Edad</label><input id="{p}edad" inputmode="numeric" placeholder="años" />{msg:edad}</div>
<div>
  <span class="l">Sexo</span>
  <div class="seg" id="{sexo}" role="group" aria-label="Sexo"></div>
</div>
<div><label class="l" for="{p}fono">Fono</label><input id="{p}fono" inputmode="tel" /></div>
